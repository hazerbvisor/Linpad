# Compilation only on x86_64. Execution requires a real AArch64 host.
# Debian/Ubuntu: clang lld gcc-aarch64-linux-gnu libsqlite3-dev:arm64
[binaries]
c = ['clang', '--target=aarch64-linux-gnu']
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
c_link_args = ['-fuse-ld=lld']

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig'
